    :root{
      --bg:#eef3f7;
      --surface:#ffffff;
      --line:#d9e3ee;
      --text:#1f2933;
      --gold:#c6a15b;
      --gold-strong:#b1893f;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      line-height:1.6;
    }
    .container{
      max-width:1140px;
      margin:0 auto;
      padding:20px;
    }

    /* HEADER */
    header{
      position:sticky;
      top:0;
      z-index:20;
      background:rgba(255,255,255,0.92);
      backdrop-filter:saturate(140%) blur(8px);
      border-bottom:1px solid var(--line);
    }
    .nav{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      flex-wrap:wrap;
      padding:10px 0;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
    }
    .brand img{
      height:40px;
      width:auto;
      border-radius:6px;
      display:block;
    }
    .logo-title{
      font-weight:800;
      letter-spacing:.2px;
    }
    .links a{
      color:var(--text);
      text-decoration:none;
      font-weight:600;
      margin:0 8px;
      opacity:.9;
      font-size:14px;
    }
    .links a:hover{
      text-decoration:underline;
      opacity:1;
    }
    .links a.active{
      text-decoration:underline;
      opacity:1;
    }
    .cta{
      display:inline-block;
      background:var(--gold);
      color:#111;
      font-weight:800;
      padding:10px 14px;
      border-radius:10px;
    }
    .cta:hover{
      background:var(--gold-strong);
      text-decoration:none;
    }

    /* HERO */
    .hero{
      padding:34px 0;
    }
    .hero-inner{
      display:grid;
      grid-template-columns:1fr;
      gap:24px;
    }
    @media(min-width:960px){
      .hero-inner{
        grid-template-columns:1.1fr .9fr;
      }
    }
    .kicker{
      opacity:.8;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.12em;
      font-size:12px;
    }
    h1{
      margin:6px 0 10px;
      font-size:34px;
      line-height:1.15;
    }
    .sub{
      opacity:.9;
      max-width:720px;
      font-size:15px;
    }
    .hr-gold{
      height:3px;
      background:linear-gradient(90deg,var(--gold),#e2c58a,var(--gold));
      border:none;
      border-radius:999px;
      margin:8px 0 14px;
    }
    .hero-tags{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:12px;
    }
    .hero-tag{
      border-radius:999px;
      border:1px solid var(--line);
      background:#f6f9fc;
      padding:4px 10px;
      font-size:12px;
      opacity:.95;
    }
    .hero-cta-row{
      margin-top:16px;
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      align-items:center;
    }
    .hero-note{
      font-size:13px;
      opacity:.8;
    }
    .hero-note a{
      color:var(--text);
      text-decoration:underline;
    }

      border-radius:16px;
      border:1px solid var(--line);
      padding:16px;
      box-shadow:0 16px 40px rgba(15,23,42,.15);
    }
